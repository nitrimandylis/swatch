# ${t.meta.name} — generated by rice, do not edit

[meta]
version = 1
name = "${m.name}"
description = "${m.description}"
variant = "${m.variant}"

[colors.core]
background = "${r.base}"            # the dark room
foreground = "${r.text}"            # cool off-white
secondary_background = "${r.surface}"  # raised panels / walls
border = "${r.overlay}"               # deep steel
accent = "${r.accent}"               # neon-pink bat-signal
accent_foreground = "${r.on_fill}"

[colors.accents]
blue = "${a.blue[1]}"
green = "${a.green[1]}"
magenta = "${r.accent}"
orange = "${x.orange}"   # not in the image; warm lamp/crimson blend
red = "${a.red[1]}"
yellow = "${a.yellow[1]}"
cyan = "${a.cyan[1]}"
purple = "${a.magenta[0]}"

[colors.text]
muted = "${r.muted}"          # steel-blue shadow
danger = "${a.red[1]}"
success = "${a.green[1]}"
placeholder = "${r.muted}"
selection = { background = "${r.accent}", foreground = "${r.on_fill}" }

[colors.input]
border_focus = "${r.accent}"

[colors.list.item.selection]
background = "${r.surface}"
secondary_background = "${r.overlay}"

[colors.grid.item]
background = "${r.surface}"

[colors.loading]
bar = "${r.accent}"
spinner = "${r.text}"

