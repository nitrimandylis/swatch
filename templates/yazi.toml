# ${m.name} — generated by rice, do not edit

[mgr]
cwd = { fg = "${a.cyan[1]}" }

hovered         = { fg = "${r.on_fill}", bg = "${r.accent}" }
preview_hovered = { underline = true }

find_keyword  = { fg = "${r.accent}", italic = true }
find_position = { fg = "${a.magenta[0]}", bg = "reset", italic = true }

marker_copied   = { fg = "${a.green[0]}", bg = "${a.green[0]}" }
marker_cut      = { fg = "${a.red[0]}", bg = "${a.red[0]}" }
marker_marked   = { fg = "${a.cyan[0]}", bg = "${a.cyan[0]}" }
marker_selected = { fg = "${r.accent}", bg = "${r.accent}" }

count_copied   = { fg = "${r.on_fill}", bg = "${a.green[0]}" }
count_cut      = { fg = "${r.on_fill}", bg = "${a.red[0]}" }
count_selected = { fg = "${r.on_fill}", bg = "${r.accent}" }

border_symbol = "│"
border_style  = { fg = "${r.overlay}" }

[mode]
normal_main = { fg = "${r.on_fill}", bg = "${r.accent}", bold = true }
normal_alt  = { fg = "${r.accent}", bg = "${r.surface}" }
select_main = { fg = "${r.on_fill}", bg = "${a.green[0]}", bold = true }
select_alt  = { fg = "${a.green[0]}", bg = "${r.surface}" }
unset_main  = { fg = "${r.on_fill}", bg = "${a.magenta[0]}", bold = true }
unset_alt   = { fg = "${a.magenta[0]}", bg = "${r.surface}" }

[status]
perm_type  = { fg = "${a.cyan[0]}" }
perm_read  = { fg = "${a.yellow[0]}" }
perm_write = { fg = "${a.red[0]}" }
perm_exec  = { fg = "${a.green[0]}" }
perm_sep   = { fg = "${r.muted}" }
progress_label  = { fg = "${r.text}", bold = true }
progress_normal = { fg = "${r.accent}", bg = "${r.surface}" }
progress_error  = { fg = "${a.red[0]}", bg = "${r.surface}" }

[pick]
border   = { fg = "${r.accent}" }
active   = { fg = "${r.accent}", bold = true }
inactive = { fg = "${r.text}" }

[input]
border   = { fg = "${r.accent}" }
selected = { reversed = true }

[cmp]
border   = { fg = "${r.accent}" }
active   = { fg = "${r.accent}", bold = true }
inactive = { fg = "${r.text}" }

[tasks]
border  = { fg = "${r.accent}" }
hovered = { fg = "${r.accent}", underline = true }

[which]
mask            = { bg = "${r.surface}" }
cand            = { fg = "${a.cyan[1]}" }
rest            = { fg = "${r.muted}" }
desc            = { fg = "${r.accent}" }
separator       = "  "
separator_style = { fg = "${r.overlay}" }

[help]
on      = { fg = "${r.accent}" }
run     = { fg = "${a.cyan[1]}" }
hovered = { reversed = true, bold = true }
footer  = { fg = "${r.surface}", bg = "${r.text}" }

[notify]
title_info  = { fg = "${a.green[0]}" }
title_warn  = { fg = "${a.yellow[0]}" }
title_error = { fg = "${a.red[0]}" }

[filetype]
rules = [
  { mime = "image/*", fg = "${a.cyan[1]}" },
  { mime = "video/*", fg = "${a.yellow[0]}" },
  { mime = "audio/*", fg = "${a.yellow[0]}" },
  { mime = "application/zip",  fg = "${a.magenta[0]}" },
  { mime = "application/gzip", fg = "${a.magenta[0]}" },
  { url = "*/", fg = "${a.blue[1]}" },
  { url = "*",  fg = "${r.text}" },
]
